interface:
  display_name: "Address GitHub Issues"
  short_description: "Triage and resolve GitHub issues safely"
  default_prompt: "Use $address-github-issues [issue-number-or-url] [--no-pr] [--no-commit] [--simple] [--effort max|xhigh|high|medium|low] [--model family]; all work uses dedicated worktrees. Omit the issue for all open issues, use --no-pr for local commits fast-forwarded into main, --no-commit for uncommitted changes, --simple to run every step in the current session without subagents, --effort to set subagent reasoning, or --model to override the subagent family."
