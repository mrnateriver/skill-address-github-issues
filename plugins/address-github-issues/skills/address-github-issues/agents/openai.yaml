interface:
  display_name: "Address GitHub Issues"
  short_description: "Triage and resolve GitHub issues safely"
  default_prompt: "Use $address-github-issues [issue-number-or-url | --label <label>] [--no-pr] [--no-commit] [--simple] [--effort max|xhigh|high|medium|low] [--model top|high|middle|low]; all work uses dedicated worktrees. Omit the issue and label for all open issues, pass --label (or specify one exact label) to process only open issues with that exact label, use --no-pr for local commits fast-forwarded into main, --no-commit for uncommitted changes, --simple to run every step in the current session without subagents, --effort to set subagent reasoning, or --model to override the subagent model tier."
