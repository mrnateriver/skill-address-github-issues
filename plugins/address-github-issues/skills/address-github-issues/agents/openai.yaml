interface:
  display_name: "Address GitHub Issues"
  short_description: "Triage and resolve GitHub issues safely"
  default_prompt: "Use $address-github-issues [issue-number-or-url] [--no-pr] [--no-commit] [--simple] [--effort max|xhigh|high|medium|low] [--model family]; omit the issue for all open issues, use --no-pr for local commits, --no-commit for uncommitted changes, --simple for one subagent per effort, --effort to set reasoning, or --model to override the family."
